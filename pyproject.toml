[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cliblaster"
version = "0.1.0"
description = "A personal terminal music player with YouTube integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "CLIBLASTER Contributor" }
]
dependencies = [
    "pygame-ce>=2.5.0",
    "textual>=8.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "yt-dlp>=2024.0.0",
    "imageio-ffmpeg>=0.4.0",
]

[project.scripts]
cliblaster = "cliblaster.cli:main"
